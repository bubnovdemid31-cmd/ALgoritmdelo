<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Алгоритм.Дело — Услуги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f7fbf8;
            --text: #1e2e2a;
            --hint: #3b5f4e;
            --link: #2d6b4a;
            --btn: #2d6b4a;
            --btn-text: #ffffff;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 16px 14px 30px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 700; color: #1a4a3a; }
        .logo span { color: var(--link); font-weight: 300; }
        .subtitle { font-size: 14px; color: var(--hint); margin-top: 4px; }
        .section-title { font-size: 18px; font-weight: 700; margin: 18px 0 12px; color: #0e2f24; }

        .product-card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1.5px solid rgba(80, 140, 110, 0.1);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(40, 80, 60, 0.04);
            transition: 0.2s;
        }
        .product-card:active { transform: scale(0.99); }
        .product-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; color: #0e2f24; }
        .product-price { font-size: 19px; font-weight: 700; color: var(--link); margin-bottom: 6px; }
        .product-desc { font-size: 13.5px; color: var(--hint); line-height: 1.45; }

        /* Выбранная услуга */
        .selected-service {
            font-size: 14px;
            padding: 12px 14px;
            background: rgba(45, 107, 74, 0.1);
            border-radius: 12px;
            color: var(--link);
            font-weight: 600;
            margin: 18px 0 14px;
            text-align: center;
        }
        .selected-service.empty {
            color: var(--hint);
            font-weight: 400;
            font-style: italic;
            background: rgba(120, 140, 130, 0.1);
        }

        /* Кнопка заявки */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(45, 107, 74, 0.25);
            transition: 0.15s;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-block {
            margin-top: 22px;
            padding: 16px;
            background: rgba(45, 107, 74, 0.08);
            border-radius: 16px;
            font-size: 13.5px;
            color: var(--hint);
            line-height: 1.5;
            text-align: center;
        }
        .info-block b { color: var(--link); }

        /* Попап успеха */
        .success-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(20,45,35,0.75);
            display: none; align-items: center; justify-content: center;
            padding: 24px;
        }
        .success-overlay.active { display: flex; }
        .success-box {
            background: #fff; border-radius: 22px;
            padding: 28px 22px; max-width: 340px; width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,20,10,0.35);
        }
        .success-icon {
            width: 64px; height: 64px; margin: 0 auto 16px;
            background: #2d6b4a; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #fff;
        }
        .success-box h2 {
            font-size: 20px; color: #0e2f24;
            margin-bottom: 8px; font-weight: 700;
        }
        .success-box p {
            font-size: 14px; color: #3b5f4e;
            line-height: 1.5; margin-bottom: 20px;
        }
        .success-box button {
            width: 100%; padding: 13px; border: none;
            background: #2d6b4a; color: #fff;
            border-radius: 14px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Алгоритм.<span>Дело</span></div>
        <div class="subtitle">Выберите услугу — мы свяжемся с вами</div>
    </div>

    <div class="section-title">Услуги</div>
    <div id="catalog"></div>

    <div class="selected-service empty" id="selectedService">
        Услуга не выбрана — тапните карточку выше
    </div>

    <button class="submit-btn" id="submitBtn" disabled>Оставить заявку</button>

    <div class="info-block">
        💬 Заявка отправляется напрямую. Мы свяжемся с вами в Telegram.
    </div>

    <!-- ПОПАП УСПЕХА -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-box">
            <div class="success-icon">✓</div>
            <h2>Заявка отправлена!</h2>
            <p>Мы свяжемся с вами в ближайшее время.</p>
            <button id="successClose">Отлично!</button>
        </div>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        const BOT_TOKEN = "8928646520:AAEwt54ioC_bu2GdW2nBAWfYe-QT2F1XXko";
        const ADMIN_ID = "1780894759";

        // ===== Данные услуг =====
        const products = [
            { id: 'tg', name: 'Telegram-бот', price: 'от 2 500 ₽', short: 'Бот с приветствием, FAQ, сбором заявок в таблицу и уведомлениями.' },
            { id: 'maxbot', name: 'Макс-бот', price: 'от 3 000 ₽', short: 'Многопоточные сценарии, оплата картой, база клиентов, рассылки.' },
            { id: 'landing', name: 'Landing Site', price: 'от 4 000 ₽', short: 'Одностраничный сайт с высокой конверсией, метриками и адаптивом.' },
            { id: 'site', name: 'Обычный сайт', price: 'от 9 990 ₽', short: '3–5 страниц, админка, SSL, регистрация в поисковиках.' },
            { id: 'catalog', name: 'Сайт с каталогом товаров', price: 'от 15 000 ₽', short: 'Умная витрина: фильтры, поиск, корзина, заказ в пару касаний.' },
            { id: 'db', name: 'Сайт с базой данных', price: 'от 25 000 ₽', short: 'Личные кабинеты, отчёты, интеграции, защита от утечек.' },
            { id: 'unity', name: 'Unity (игры / симуляторы)', price: 'Договорная', short: '2D/3D игры, симуляторы, визуализация, помощь в доработке.' }
        ];

        let selectedProduct = null;

        // ===== Рендер карточек =====
        const catalogEl = document.getElementById('catalog');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.id = p.id;
            card.innerHTML = `
                <h3>${p.name}</h3>
                <div class="product-price">${p.price}</div>
                <div class="product-desc">${p.short}</div>
            `;
            card.addEventListener('click', () => selectProduct(p));
            catalogEl.appendChild(card);
        });

        // ===== Выбор услуги =====
        const submitBtn = document.getElementById('submitBtn');
        const selEl = document.getElementById('selectedService');

        function selectProduct(p) {
            selectedProduct = p;

            document.querySelectorAll('.product-card').forEach(c => {
                const active = c.dataset.id === p.id;
                c.style.borderColor = active ? '#2d6b4a' : 'rgba(80, 140, 110, 0.1)';
                c.style.borderWidth = active ? '2px' : '1.5px';
            });

            selEl.textContent = `Выбрано: ${p.name} (${p.price})`;
            selEl.classList.remove('empty');
            submitBtn.disabled = false;

            submitBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== Отправка заявки =====
        submitBtn.addEventListener('click', async () => {
            if (!selectedProduct) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            // Получаем данные из Telegram (если открыто в Telegram)
            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const username = tgUser?.username ? `@${tgUser.username}` : '—';
            const fullname = tgUser
                ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim()
                : '—';
            const userId = tgUser?.id || '—';

            const text =
                `🔔 НОВАЯ ЗАЯВКА\n\n` +
                `🛠 Услуга: ${selectedProduct.name}\n` +
                `💰 Цена: ${selectedProduct.price}\n\n` +
                `👤 ${fullname}\n` +
                `🔗 ${username}\n` +
                `🆔 ${userId}`;

            try {
                const r = await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: ADMIN_ID, text: text })
                    }
                );
                const data = await r.json();
                console.log("Ответ Telegram:", data);

                if (data.ok) {
                    document.getElementById('successOverlay').classList.add('active');

                    // Сброс
                    selectedProduct = null;
                    selEl.textContent = 'Услуга не выбрана — тапните карточку выше';
                    selEl.classList.add('empty');
                    document.querySelectorAll('.product-card').forEach(c => {
                        c.style.borderColor = 'rgba(80, 140, 110, 0.1)';
                        c.style.borderWidth = '1.5px';
                    });
                } else {
                    alert("❌ Ошибка: " + data.description);
                }
            } catch (e) {
                console.error("Ошибка:", e);
                alert("❌ Ошибка сети. Проверьте интернет.");
            } finally {
                submitBtn.disabled = true; // снова выключена, пока не выберут услугу
                submitBtn.textContent = 'Оставить заявку';
            }
        });

        // ===== Закрытие попапа =====
        document.getElementById('successClose').onclick = () => {
            document.getElementById('successOverlay').classList.remove('active');
        };
    </script>
</body>
</html>
